---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    performance:
        runs-on: ubuntu-latest
        name: Performance
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Attribute native project creation with batched sources
              run: |
                  node --input-type=module <<'PROFILE'
                  import { performanceCases } from './source/benchmarks/performance-cases.ts';
                  import { writeConsumer } from './source/benchmarks/consumer-fixture.ts';
                  import { observeProjectInputs, verifyProjectInputs } from './source/packages/type-test/frozen-inputs.ts';
                  import { compilerFileSystem } from './source/packages/type-test/compiler-file-system.ts';
                  import { API } from 'typescript-beta/async';
                  import { createFileSystemLayer } from 'typescript-beta/fs';
                  import { resolve } from 'node:path';
                  import { isDeepStrictEqual } from 'node:util';
                  const root = resolve('target/performance/stage-profile');
                  const config = resolve(root,'tsconfig.json');
                  const workload = performanceCases.find(entry => entry.id === 'type-test-cli-many-files-serial');
                  await writeConsumer(root,resolve('node_modules'),workload);
                  let known;
                  let sources;
                  const signal = new AbortController().signal;
                  for (const mode of ['observed','canonical-layer','all-layer','canonical-layer','observed']) {
                      const observation = observeProjectInputs();
                      const api = new API({ cwd:root,fs:observation.fs,runExternalCode:false });
                      const parsed = await api.parseConfigFile(config);
                      const started = performance.now();
                      let layer;
                      let loaded = 0;
                      if (mode !== 'observed') {
                          verifyProjectInputs(known,signal);
                          const files = known.files.filter(entry => entry.value !== null &&
                              (mode === 'all-layer' || compilerFileSystem.realpath(entry.path) === entry.path));
                          layer = createFileSystemLayer(files.map(entry=>[entry.path,observation.fs.readFile(entry.path)]));
                          loaded = files.length;
                      }
                      const opened = performance.now();
                      const parameters = { rootFiles:parsed.fileNames,compilerOptions:parsed.options };
                      const program = (await api.createSnapshot({createPrograms:[parameters],fileSystem:layer})).operation.createdPrograms[0];
                      const names = await program.getSourceFileNames();
                      for (const path of names) observation.fs.realpath(path);
                      const recorded = observation.snapshot();
                      known ??= recorded;
                      sources ??= names;
                      const extras = Object.fromEntries(Object.entries(recorded).map(([group,entries])=>{
                          const knownPaths = new Map(known[group].map(({path,value})=>[path,value]));
                          return [group,entries.filter(({path,value})=>!knownPaths.has(path) || !isDeepStrictEqual(knownPaths.get(path),value)).length];
                      }));
                      console.log(JSON.stringify({mode,loaded,read:Math.round(opened-started),create:Math.round(performance.now()-opened),sameSources:isDeepStrictEqual(names,sources),extras}));
                      await api.close();
                  }
                  PROFILE
