---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    performance:
        runs-on: ubuntu-latest
        name: Performance
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Check out the performance baseline
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: 98b24f25ed84b60bfa16935df7795cbc934fb9b7
                  path: target/performance-baseline-source
                  persist-credentials: false
            - name: Benchmark the baseline
              working-directory: target/performance-baseline-source
              run: |
                  npm ci
                  node build-benchmark-html.js
                  node source/benchmarks/run-performance.entry-point.ts compare ../performance/baseline type-test-cli-many-files-serial source/benchmarks/baselines/shared.json
            - name: Benchmark the checkout
              run: |
                  node build-benchmark-html.js
                  node source/benchmarks/run-performance.entry-point.ts compare target/performance/full type-test-cli-many-files-serial source/benchmarks/baselines/shared.json
            - name: Retain performance evidence
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: performance
                  path: |
                      target/performance/full/report.html
                      target/performance/full/measurements.json
                      target/performance/full/state
                      target/performance/baseline/report.html
                      target/performance/baseline/measurements.json
