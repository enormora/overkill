---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    static-analysis:
        runs-on: ubuntu-latest
        name: Static analysis
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run static analysis
              run: npx just lint
            - name: Type tests
              run: npx just test-types

    compile:
        runs-on: ubuntu-latest
        name: Compile TypeScript
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Compile TypeScript
              run: npx just compile

    unit-tests:
        runs-on: ubuntu-latest
        name: Unit tests
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run unit tests
              run: npx just test-unit
            - name: Check test coverage
              run: npx just test-unit-with-coverage

    package-smoke-tests:
        runs-on: ubuntu-latest
        name: Package smoke tests
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run package smoke tests
              run: npx just test-package-smoke

    package-dry-run:
        runs-on: ubuntu-latest
        name: Package dry run
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Dry-run package publish
              run: npx just publish-dry-run

    workflow-security:
        runs-on: ubuntu-latest
        name: Workflow security analysis
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Run zizmor
              id: zizmor
              uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
              with:
                  version: 1.26.1
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
                  advanced-security: false
                  annotations: true
