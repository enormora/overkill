---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    static-analysis:
        runs-on: ubuntu-latest
        name: Static analysis
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run static analysis
              run: npx just lint
            - name: Type tests
              run: npx just test-types

    compile:
        runs-on: ubuntu-latest
        name: Compile TypeScript
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Compile TypeScript
              run: npx just compile

    unit-tests:
        runs-on: ubuntu-latest
        name: Unit tests
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run unit tests
              run: npx just test-unit
            - name: Check test coverage
              run: npx just test-unit-with-coverage

    runner-integration-tests:
        runs-on: ubuntu-latest
        name: Runner integration tests
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run runner integration tests
              run: npx just test-runner-integration

    package-dry-run:
        runs-on: ubuntu-latest
        name: Package dry run
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Run package smoke tests
              run: npx just test-package-smoke
            - name: Publish dry run
              run: npx just publish-dry-run

    workflow-security:
        runs-on: ubuntu-latest
        name: Workflow security analysis
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run zizmor
              id: zizmor
              uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
              with:
                  version: 1.26.1
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
                  advanced-security: false
                  annotations: true
