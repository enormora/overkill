---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    performance:
        runs-on: ubuntu-latest
        name: Performance
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Use Node.js from package metadata
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: package.json
            - name: Install dependencies
              run: npm ci
            - name: Profile production type-test stages
              run: |
                  node --input-type=module <<'PROFILE'
                  import { readFileSync, writeFileSync } from 'node:fs';
                  import { resolve } from 'node:path';
                  import ts from 'typescript';
                  import { performanceCases } from './source/benchmarks/performance-cases.ts';
                  import { writeConsumer } from './source/benchmarks/consumer-fixture.ts';
                  const targets = {
                    'source/packages/type-test/frozen-project.ts': ['parseProject','openAnalysisProject','captureProject','loadProject','verifyProjectSources','verifyFrozenProject'],
                    'source/packages/type-test/installed-compiler.ts': ['compilerFiles','installation','loadCompiler','verifyCompilerResolution','verifyCompilerContents','verifyInstalledCompiler','resolveInstalledCompiler'],
                    'source/packages/type-test/frozen-inputs.ts': ['verifyProjectInputs'],
                    'source/packages/type-test/original-assertions.ts': ['collectOriginalAssertions'],
                    'source/packages/type-test/native-execution.ts': ['validateProject','checkOriginalAssertions','collectProject'],
                    'source/packages/type-test/compiler-plan.ts': ['collectCompilerGroups','checkCompilerGroups','prepare'],
                    'source/config/adapter-facts.ts': ['parseAdapterFacts'],
                    'source/run/supervised-run.ts': ['runSupervisedCommand','createLiveRun','executeCollectedLiveRun'],
                  };
                  const output = JSON.stringify(resolve('target/performance/app-stage-times.jsonl'));
                  const helper = "import { appendFileSync as appendStage } from 'node:fs';\n"
                    + 'function recordStage(name: string, start: number, previous: NodeJS.CpuUsage): void {\n'
                    + '    const cpu = process.cpuUsage(previous);\n'
                    + '    appendStage(' + output + ', JSON.stringify({ pid: process.pid, name, end: Date.now(), wall: Math.round(performance.now() - start), cpu: Math.round((cpu.user + cpu.system) / 1000) }) + "\\n");\n'
                    + '}\n';
                  for (const [file, names] of Object.entries(targets)) {
                    let source = readFileSync(file, 'utf8');
                    for (const name of names) {
                      const parsed = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true);
                      const declaration = parsed.statements.find(statement =>
                        ts.isFunctionDeclaration(statement) && statement.name?.text === name);
                      if (!declaration?.body) throw new Error('Missing function body ' + name + ' in ' + file);
                      const start = declaration.body.getStart(parsed) + 1;
                      const close = declaration.body.end - 1;
                      source = source.slice(0, start)
                        + '    const stageStarted = performance.now();\n    const stageCpu = process.cpuUsage();\n    try {\n'
                        + source.slice(start, close)
                        + '\n    } finally { recordStage(' + JSON.stringify(name) + ', stageStarted, stageCpu); }'
                        + source.slice(close);
                    }
                    writeFileSync(file, helper + source);
                  }
                  const workload = performanceCases.find(entry => entry.id === 'type-test-cli-many-files-serial');
                  if (!workload) throw new Error('Missing original benchmark workload');
                  await writeConsumer(resolve('target/performance/stage-profile'), resolve('node_modules'), workload);
                  PROFILE
                  project="$PWD"
                  for phase in cold warm; do
                      : > "$project/target/performance/app-stage-times.jsonl"
                      (
                          cd target/performance/stage-profile
                          env -i PATH="$PATH" LANG=C TZ=UTC node --permission-audit --allow-inspector --disable-warning=PERM0004 "$project/source/packages/test/overkill.entry-point.ts" run --config consumer-config.mjs --profile measured --seed 42 --order lexical
                      )
                      printf '%s\n' "$phase"
                      cat "$project/target/performance/app-stage-times.jsonl"
                  done
